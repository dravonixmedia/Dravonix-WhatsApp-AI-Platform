name = "dravonixapp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   SUPABASE_SERVICE_ROLE_KEY, META_APP_SECRET, META_VERIFY_TOKEN
# Non-secret vars can go in [vars] per environment, or in a .dev.vars file for
# local `wrangler dev` (see CLOUDFLARE_SETUP.md).

[vars]
APP_ENV = "development"

[[queues.producers]]
queue = "dravonix-message-queue"
binding = "MESSAGE_QUEUE"

[[queues.producers]]
queue = "dravonix-voice-queue"
binding = "VOICE_QUEUE"
