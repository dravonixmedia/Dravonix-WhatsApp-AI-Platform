name = "dravonixapp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   SUPABASE_SERVICE_ROLE_KEY, META_APP_SECRET, META_VERIFY_TOKEN
# Non-secret vars can go in [vars] per environment, or in a .dev.vars file for
# local `wrangler dev` (see CLOUDFLARE_SETUP.md).

[vars]
APP_ENV = "development"

# Queue producer bindings -- commented out until the underlying queues exist
# in this Cloudflare account (Wrangler refuses to deploy a binding to a queue
# that hasn't been created yet: `npx wrangler queues create <name>`).
# Uncomment once both queues exist, then redeploy -- see CLOUDFLARE_SETUP.md.
#
# [[queues.producers]]
# queue = "dravonix-message-queue"
# binding = "MESSAGE_QUEUE"
#
# [[queues.producers]]
# queue = "dravonix-voice-queue"
# binding = "VOICE_QUEUE"
