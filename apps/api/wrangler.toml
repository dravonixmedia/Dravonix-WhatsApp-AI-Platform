name = "dravonixapp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   SUPABASE_SERVICE_ROLE_KEY, META_APP_SECRET, META_VERIFY_TOKEN
# Non-secret vars can go in [vars] per environment, or in a .dev.vars file for
# local `wrangler dev` (see CLOUDFLARE_SETUP.md).
#
# This top-level (unnamed environment) config is used only by local
# `wrangler dev` -- every real deploy goes through .github/workflows/deploy.yml,
# which always passes an explicit --env staging or --env production (see
# those blocks below). Nothing here is ever deployed directly.

[vars]
APP_ENV = "development"

# Queue producer bindings. Cloudflare Workers Builds' auto-provisioned CI
# deploy token cannot verify/bind Queues (confirmed repeatedly: "Queue does
# not exist" despite the queue being visible and operational in the
# dashboard) -- these bindings previously had to be re-added by hand via the
# dashboard after every deploy. Deploying instead through
# .github/workflows/deploy.yml with a custom-scoped CLOUDFLARE_API_TOKEN
# (Account: Workers Queues:Edit, Workers Scripts:Edit) resolves this, since
# that token actually has permission to manage Queues. If bindings ever
# disappear again after a deploy, check that the GitHub Actions deploy ran
# (not Workers Builds) and that the token still has Queues:Edit.
[[queues.producers]]
queue = "dravonix-message-queue"
binding = "MESSAGE_QUEUE"

[[queues.producers]]
queue = "dravonix-voice-queue"
binding = "VOICE_QUEUE"

# ---------------------------------------------------------------------------
# Staging -- isolated Worker, queues, and vars. Distinct resource names mean a
# staging deploy (`wrangler deploy --env staging`) cannot touch any production
# resource: there is no name overlap for wrangler/Cloudflare to collide on.
# See CLOUDFLARE_SETUP.md for the full resource-name table and the queue
# creation commands for these staging queues.
# ---------------------------------------------------------------------------
[env.staging]
name = "dravonixapp-staging"

[env.staging.vars]
APP_ENV = "staging"

[[env.staging.queues.producers]]
queue = "dravonix-message-queue-staging"
binding = "MESSAGE_QUEUE"

[[env.staging.queues.producers]]
queue = "dravonix-voice-queue-staging"
binding = "VOICE_QUEUE"

# ---------------------------------------------------------------------------
# Production -- the long-lived live Worker (already deployed and serving real
# WhatsApp traffic; see TASKS.md). Mirrors the top-level config so that
# .github/workflows/deploy.yml can always deploy with an explicit --env flag
# instead of relying on wrangler's bare (unnamed-environment) default.
# ---------------------------------------------------------------------------
[env.production]
name = "dravonixapp"

[env.production.vars]
APP_ENV = "production"

[[env.production.queues.producers]]
queue = "dravonix-message-queue"
binding = "MESSAGE_QUEUE"

[[env.production.queues.producers]]
queue = "dravonix-voice-queue"
binding = "VOICE_QUEUE"
