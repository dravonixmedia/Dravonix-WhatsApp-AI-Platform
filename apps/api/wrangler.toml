name = "dravonixapp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   SUPABASE_SERVICE_ROLE_KEY, META_APP_SECRET, META_VERIFY_TOKEN
# Non-secret vars can go in [vars] per environment, or in a .dev.vars file for
# local `wrangler dev` (see CLOUDFLARE_SETUP.md).

[vars]
APP_ENV = "development"

# Queue producer bindings. Cloudflare Workers Builds' auto-provisioned CI
# deploy token cannot verify/bind Queues (confirmed repeatedly: "Queue does
# not exist" despite the queue being visible and operational in the
# dashboard) -- these bindings previously had to be re-added by hand via the
# dashboard after every deploy. Deploying instead through
# .github/workflows/deploy.yml with a custom-scoped CLOUDFLARE_API_TOKEN
# (Account: Workers Queues:Edit, Workers Scripts:Edit) resolves this, since
# that token actually has permission to manage Queues. If bindings ever
# disappear again after a deploy, check that the GitHub Actions deploy ran
# (not Workers Builds) and that the token still has Queues:Edit.
[[queues.producers]]
queue = "dravonix-message-queue"
binding = "MESSAGE_QUEUE"

[[queues.producers]]
queue = "dravonix-voice-queue"
binding = "VOICE_QUEUE"
