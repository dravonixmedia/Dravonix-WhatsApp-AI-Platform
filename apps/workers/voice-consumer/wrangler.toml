name = "dravonix-audio"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via the Cloudflare dashboard or `wrangler secret put <NAME>`,
# never committed): SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY, SUPABASE_URL,
# ANTHROPIC_API_KEY, META_ACCESS_TOKEN, GOOGLE_CLOUD_CREDENTIALS (the full
# service-account JSON key, as a single-line string).

[vars]
APP_ENV = "development"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "dravonix-audio"

# Queue consumer binding -- commented out because Cloudflare Workers Builds'
# CI deploy token cannot verify/bind Queues even when they exist (confirmed
# repeatedly for apps/api and apps/workers/message-consumer: "Queue does not
# exist" despite the queue being visible and fully operational in the
# dashboard). Deploy without this binding, then attach the consumer to
# dravonix-voice-queue manually via the dashboard (queue's own page ->
# Bindings -> Add Consumer) using the full-permission interactive login. This
# must be redone after every push that redeploys this Worker.
#
# [[queues.consumers]]
# queue = "dravonix-voice-queue"
# max_batch_size = 5
# max_retries = 3
