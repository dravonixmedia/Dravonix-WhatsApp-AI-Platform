name = "dravonix-audio"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via the Cloudflare dashboard or `wrangler secret put <NAME>`,
# never committed): SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY, SUPABASE_URL,
# ANTHROPIC_API_KEY, META_ACCESS_TOKEN, ELEVENLABS_API_KEY (both speech-to-text
# and text-to-speech -- see docs/architecture/adr-0005-speech-provider-architecture.md
# for why this replaced Google STT/TTS and Whisper).
#
# This top-level (unnamed environment) config is used only by local
# `wrangler dev` -- every real deploy goes through .github/workflows/deploy.yml,
# which always passes an explicit --env staging or --env production (see
# those blocks below). Nothing here is ever deployed directly.

[vars]
APP_ENV = "development"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "dravonix-audio"

# Queue consumer binding. Cloudflare Workers Builds' auto-provisioned CI
# deploy token cannot verify/bind Queues (confirmed repeatedly: "Queue does
# not exist" despite the queue being visible and operational in the
# dashboard) -- this previously had to be re-added by hand via the queue's
# own page after every deploy. Deploying instead through
# .github/workflows/deploy.yml with a custom-scoped CLOUDFLARE_API_TOKEN
# (Account: Workers Queues:Edit, Workers Scripts:Edit) resolves this, since
# that token actually has permission to manage Queues.
[[queues.consumers]]
queue = "dravonix-voice-queue"
max_batch_size = 5
max_retries = 3

# ---------------------------------------------------------------------------
# Staging -- isolated Worker, queue, and R2 bucket. Distinct resource names
# mean a staging deploy (`wrangler deploy --env staging`) cannot touch any
# production resource. See CLOUDFLARE_SETUP.md for the full resource-name
# table and the staging queue/bucket creation commands.
# ---------------------------------------------------------------------------
[env.staging]
name = "dravonix-audio-staging"

[env.staging.vars]
APP_ENV = "staging"
# Voice replies are text-only in staging while the Malayalam TTS pronunciation
# fix is validated -- see VOICE_REPLY_MODE in packages/config/src/env.ts.
# This is also the safe default when unset; set explicitly here for clarity.
VOICE_REPLY_MODE = "text_only"

[[env.staging.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "dravonix-audio-staging"

[[env.staging.queues.consumers]]
queue = "dravonix-voice-queue-staging"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "dravonix-voice-queue-staging-dlq"

# Intentionally NOT bound as its own [[env.staging.queues.consumers]] entry
# yet. src/worker.ts already has a triage-only handler for it
# (handleVoiceDlqBatch, routed via batch.queue ending in "-dlq") and it is
# unit-tested, but binding a consumer here would start draining
# dravonix-voice-queue-staging-dlq's existing backlog on the next deploy.
# Do not add a `[[queues.consumers]]` entry for the "-dlq" queue without
# explicit approval -- see the voice pipeline reliability phase's DLQ
# safety report.

# ---------------------------------------------------------------------------
# Production -- the long-lived live Worker (already deployed and serving real
# WhatsApp traffic; see TASKS.md). Mirrors the top-level config so that
# .github/workflows/deploy.yml can always deploy with an explicit --env flag.
# ---------------------------------------------------------------------------
[env.production]
name = "dravonix-audio"

[env.production.vars]
APP_ENV = "production"

[[env.production.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "dravonix-audio"

[[env.production.queues.consumers]]
queue = "dravonix-voice-queue"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "dravonix-voice-queue-dlq"

# Same note as env.staging above: dravonix-voice-queue-dlq intentionally has
# no consumer binding of its own yet.
