name = "dravonix-whatsapp-ai-platform"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via the Cloudflare dashboard or `wrangler secret put <NAME>`,
# never committed): SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY, SUPABASE_URL,
# ANTHROPIC_API_KEY, META_ACCESS_TOKEN.

[vars]
APP_ENV = "development"

# Queue consumer binding -- commented out because Cloudflare Workers Builds'
# CI deploy token cannot verify/bind Queues even when they exist (confirmed
# twice now: "Queue does not exist" despite the queue being visible and fully
# operational in the dashboard). This is a persistent Workers Builds
# limitation, not a transient one -- do not retest without CLI/wrangler access
# to deploy outside the CI pipeline.
#
# Workaround: deploy without this binding, then attach the consumer to
# dravonix-message-queue manually via the dashboard (queue's own page ->
# Bindings -> Add Consumer) using the full-permission interactive login
# instead of the CI pipeline's scoped token. This must be redone after every
# push that redeploys this Worker, since a CI deploy resets bindings to
# exactly what's declared here.
#
# [[queues.consumers]]
# queue = "dravonix-message-queue"
# max_batch_size = 10
# max_retries = 3
