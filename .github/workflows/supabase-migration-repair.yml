name: Supabase Migration History Repair (Staging)

# Temporary, manual-only workflow to reconcile the staging Supabase
# project's migration-history bookkeeping (supabase_migrations.schema_migrations)
# with the 11 migration files already applied to it outside the CLI's
# tracked workflow -- see SUPABASE_SETUP.md §3a for the full background.
#
# This workflow ONLY repairs tracking metadata. `supabase migration repair
# --status applied` writes rows into supabase_migrations.schema_migrations
# and does not execute any migration SQL (confirmed against Supabase's own
# CLI reference docs) -- it never runs db push, db reset, or migration up,
# and never touches application tables or data.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Type REPAIR-STAGING-MIGRATION-HISTORY exactly to confirm. This
          workflow only repairs Supabase's migration-tracking metadata for
          the staging project -- it never executes migration SQL and never
          runs db push/db reset/migration up.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-migration-repair-staging
  cancel-in-progress: false

jobs:
  repair:
    name: Repair staging migration history
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Verify confirmation phrase
        # The input is passed through `env:` rather than interpolated
        # directly into the script (`${{ inputs.confirmation }}` inline in
        # `run:`) so its raw text is never spliced into shell syntax before
        # the shell runs -- standard GitHub Actions script-injection
        # hardening for any untrusted/free-text workflow_dispatch input.
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION_INPUT" != "REPAIR-STAGING-MIGRATION-HISTORY" ]]; then
            echo "::error::Confirmation input did not exactly match REPAIR-STAGING-MIGRATION-HISTORY. Aborting before touching anything."
            exit 1
          fi
          echo "Confirmation phrase matched."

      - uses: actions/checkout@v4

      - name: Preflight -- verify project ref, local migration files, and planned-command safety
        run: |
          set -euo pipefail

          echo "== Verifying SUPABASE_PROJECT_ID =="
          if [[ "$SUPABASE_PROJECT_ID" != "lshfkxirfbjwlklqwqnf" ]]; then
            echo "::error::SUPABASE_PROJECT_ID ('$SUPABASE_PROJECT_ID') does not equal the confirmed staging project ref lshfkxirfbjwlklqwqnf. Aborting."
            exit 1
          fi
          echo "OK: SUPABASE_PROJECT_ID matches the confirmed staging project ref."

          echo "== Verifying local migration files =="
          bash supabase/migrations/validate-sequence.sh

          actual_count=$(ls supabase/migrations/*.sql | wc -l)
          if [[ "$actual_count" -ne 11 ]]; then
            echo "::error::Expected exactly 11 migration files, found $actual_count. Aborting."
            exit 1
          fi
          echo "OK: exactly 11 migration files present, versions 00000000000001-00000000000011."

          echo "== Verifying only migration-history metadata commands are planned =="
          # Checked against a fixed list of this job's actual `supabase`
          # invocations (kept in sync with the steps below by hand) -- not a
          # scan of this workflow file's own text, which would also match
          # this step's explanatory comments and the forbidden-pattern
          # strings themselves.
          planned_commands=(
            "supabase projects list"
            "supabase link --project-ref"
            "supabase migration list --linked"
            "supabase migration repair --status applied --linked"
          )
          forbidden_patterns=(
            "supabase db push"
            "supabase db reset"
            "supabase migration up"
            "apply_migration"
          )
          for cmd in "${planned_commands[@]}"; do
            for bad in "${forbidden_patterns[@]}"; do
              if [[ "$cmd" == *"$bad"* ]]; then
                echo "::error::Planned command '$cmd' contains forbidden pattern '$bad'. Aborting."
                exit 1
              fi
            done
          done
          echo "OK: only migration-history metadata commands are planned (projects list, link, migration list, migration repair --status applied). No migration SQL will be executed."

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: List accessible Supabase projects
        run: supabase projects list

      - name: Link to the staging project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Migration history BEFORE repair
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee /tmp/migration-history-before.txt

      - name: Repair migration-tracking history (metadata only -- no SQL executed)
        run: |
          supabase migration repair \
            00000000000001 \
            00000000000002 \
            00000000000003 \
            00000000000004 \
            00000000000005 \
            00000000000006 \
            00000000000007 \
            00000000000008 \
            00000000000009 \
            00000000000010 \
            00000000000011 \
            --status applied \
            --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Migration history AFTER repair
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee /tmp/migration-history-after.txt

      - name: Verify all 11 versions now appear in LOCAL and REMOTE
        run: |
          set -euo pipefail
          versions=(00000000000001 00000000000002 00000000000003 00000000000004 00000000000005 00000000000006 00000000000007 00000000000008 00000000000009 00000000000010 00000000000011)
          # `supabase migration list` renders one row per version as
          # "LOCAL │ REMOTE │ TIME" -- a version present on both sides prints
          # its 14-digit string twice on that row (once per column). A
          # version missing from one side prints it only once.
          status=0
          for v in "${versions[@]}"; do
            count=$(grep -o "$v" /tmp/migration-history-after.txt | wc -l)
            if [[ "$count" -lt 2 ]]; then
              echo "::error::Version $v does not appear in both LOCAL and REMOTE after repair (found $count occurrence(s))."
              status=1
            else
              echo "OK: $v present in both LOCAL and REMOTE."
            fi
          done
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Post-repair migration history is still inconsistent. See the job summary/logs above."
            exit 1
          fi
          echo "All 11 versions confirmed applied in both LOCAL and REMOTE."

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Supabase staging migration-history repair"
            echo ""
            echo "**Project ref:** \`${SUPABASE_PROJECT_ID}\`"
            echo ""
            echo "**Migration versions targeted:** 00000000000001 through 00000000000011 (11 total)"
            echo ""
            echo "### Migration history BEFORE repair"
            echo '```'
            [[ -f /tmp/migration-history-before.txt ]] && cat /tmp/migration-history-before.txt || echo "(not captured -- an earlier step failed first)"
            echo '```'
            echo ""
            echo "### Migration history AFTER repair"
            echo '```'
            [[ -f /tmp/migration-history-after.txt ]] && cat /tmp/migration-history-after.txt || echo "(not captured -- repair step did not complete)"
            echo '```'
            echo ""
            echo "**No migration SQL was executed.** The only Supabase CLI commands run in this job were \`projects list\`, \`link\`, \`migration list --linked\`, and \`migration repair --status applied --linked\` -- the last of which, per Supabase's own CLI reference, writes tracking-table metadata only. Migrations 1-11's \`.sql\` files were never opened or run by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
