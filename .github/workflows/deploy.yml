name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: >-
          GitHub Environment to deploy under. Selecting "production" only
          runs once approved by that environment's required reviewers
          (configure this in Settings → Environments → production) — this is
          the manual-approval gate for production deploys. There is no
          automatic deploy on push; every deploy is a deliberate, human-
          triggered run of this workflow.
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  check-ci:
    name: Require green CI for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # Runs before the approval-gated deploy job below and before any
    # Cloudflare credential is touched, so a red or pending CI run is
    # rejected immediately regardless of target_environment. This is what
    # actually enforces "never deploy a commit CI hasn't passed" -- the
    # environment approval gate on the deploy job below is a *human*
    # checkpoint, not a substitute for this automated one.
    steps:
      - name: Find latest CI run for ${{ github.sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
            });

            const completed = data.workflow_runs
              .filter((run) => run.status === "completed")
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (completed.length === 0) {
              core.setFailed(
                `No completed CI run found for commit ${context.sha}. ` +
                `Push this commit (or wait for its CI run to finish) before deploying.`,
              );
              return;
            }

            const latest = completed[0];
            if (latest.conclusion !== "success") {
              core.setFailed(
                `Latest CI run for commit ${context.sha} concluded "${latest.conclusion}" ` +
                `(${latest.html_url}), not "success". Refusing to deploy.`,
              );
              return;
            }

            core.info(`CI run ${latest.html_url} succeeded for commit ${context.sha}. Proceeding.`);

  deploy:
    name: Deploy Cloudflare Workers (${{ inputs.target_environment }})
    needs: check-ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    # apps/api and apps/workers/{message-consumer,voice-consumer}/wrangler.toml
    # each declare distinct [env.staging]/[env.production] blocks -- separate
    # Worker names, queues, and (for voice-consumer) R2 bucket, see
    # CLOUDFLARE_SETUP.md's resource-name table. Passing --env here is what
    # keeps a staging run from ever addressing a production resource: there is
    # no shared name for wrangler/Cloudflare to collide on.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Wrangler's own debug-log controls (all genuinely read by the pinned
      # wrangler 3.x in apps/*/package.json -- verified against its bundled
      # source, not assumed). WRANGLER_LOG_SANITIZE already defaults to
      # "true" upstream; set explicitly so that's not silently relying on a
      # default. There is no supported --log-level/--verbose flag on this
      # wrangler version (confirmed: `wrangler deploy --log-level debug`
      # fails with a yargs CommandLineArgsError on 3.114.17) -- these env
      # vars are the only supported way to raise Wrangler's own log verbosity.
      # WRANGLER_LOG_PATH is deliberately NOT set here: the `runner` context
      # is not available while evaluating jobs.<job_id>.env (only github,
      # needs, strategy, matrix, vars, secrets, inputs are) -- `${{ runner.temp }}`
      # in this block fails workflow parsing before Wrangler even starts. It's
      # set instead via $GITHUB_ENV in the "Configure Wrangler diagnostics"
      # step below, which runs inside a step where `runner` is available.
      WRANGLER_LOG: debug
      WRANGLER_LOG_SANITIZE: true
      FORCE_COLOR: 0
    steps:
      - uses: actions/checkout@v4

      - name: Configure Wrangler diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "WRANGLER_LOG_PATH=${RUNNER_TEMP}/wrangler-logs" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/wrangler-logs"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnostics (non-sensitive)
        # Deliberately omits everything in the job's `env:` above except
        # WRANGLER_LOG*/FORCE_COLOR -- CLOUDFLARE_API_TOKEN/ACCOUNT_ID are
        # never echoed here or anywhere else in this job.
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Wrangler: $(cd apps/api && pnpm exec wrangler --version)"
          echo "Target environment: ${{ inputs.target_environment }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Working directory: $(pwd)"

      - name: Preflight — verify resolved ${{ inputs.target_environment }} resource names
        # Prints and validates every Worker name/queue/dead_letter_queue/R2
        # bucket name that wrangler will actually resolve for this
        # environment, straight from each wrangler.toml's [env.*] block --
        # before any Cloudflare credential is used. This exists because a
        # staging deploy once resolved the unsuffixed production queue
        # (dravonix-message-queue instead of dravonix-message-queue-staging),
        # a mistake wrangler's own --dry-run output can't catch (it doesn't
        # print queue consumer bindings at all). See scripts/verify-wrangler-
        # env-bindings.sh for exactly what's checked.
        run: |
          for toml in apps/api/wrangler.toml \
                      apps/workers/message-consumer/wrangler.toml \
                      apps/workers/voice-consumer/wrangler.toml \
                      apps/workers/outbound-reconciler/wrangler.toml; do
            bash scripts/verify-wrangler-env-bindings.sh "$toml" "${{ inputs.target_environment }}"
          done

      - name: Deploy apps/api
        working-directory: apps/api
        run: bash ../../scripts/deploy-with-diagnostics.sh "${{ inputs.target_environment }}" apps/api

      - name: Deploy message-consumer
        working-directory: apps/workers/message-consumer
        run: bash ../../../scripts/deploy-with-diagnostics.sh "${{ inputs.target_environment }}" apps/workers/message-consumer

      - name: Deploy voice-consumer
        working-directory: apps/workers/voice-consumer
        run: bash ../../../scripts/deploy-with-diagnostics.sh "${{ inputs.target_environment }}" apps/workers/voice-consumer

      - name: Deploy outbound-reconciler
        working-directory: apps/workers/outbound-reconciler
        run: bash ../../../scripts/deploy-with-diagnostics.sh "${{ inputs.target_environment }}" apps/workers/outbound-reconciler

      - name: Print Wrangler logs on failure
        if: failure()
        shell: bash
        run: |
          echo "===== Wrangler debug logs ====="
          find "$WRANGLER_LOG_PATH" \
            -type f \
            -name '*.log' \
            -print \
            -exec sed -n '1,500p' {} \; || true

      - name: Upload Wrangler logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-logs-${{ inputs.target_environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/wrangler-logs
          if-no-files-found: ignore
          retention-days: 7
