name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    # No provider API keys (META_*, ANTHROPIC_API_KEY, ELEVENLABS_API_KEY,
    # RAZORPAY_KEY_*) are set here, by design: packages/config/src/env.ts treats
    # every one of them as optional, and packages/whatsapp, packages/ai,
    # packages/speech, and packages/billing each fall back to an in-memory Mock
    # provider when its key is absent (see .env.example). Running CI without
    # them exercises those mock providers deterministically on every run and
    # guarantees no real Meta/Anthropic/ElevenLabs/Razorpay account is ever
    # contacted from this workflow. Do not add real credentials to this job.
    env:
      APP_ENV: test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          # apps/web's wrangler (^4.118.0, required by @opennextjs/cloudflare)
          # refuses to run at all under Node < 22 ("Wrangler requires at
          # least Node.js v22.0.0") -- verified against the installed
          # version. apps/api/apps/workers/* still pin wrangler ^3.99.0,
          # which only requires Node >=16.17.0, so this bump is backward
          # compatible with every other build in this job.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (mock Meta/Claude/ElevenLabs/Razorpay providers)
        run: pnpm test

      - name: Migration validation (sequencing)
        run: bash supabase/migrations/validate-sequence.sh

      - name: Database & RLS tenant-isolation tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm test:db

      - name: Build verification — apps/web (Next.js)
        run: pnpm --filter @dravonix/web build

      - name: Preflight — verify apps/web staging/production Cloudflare config
        run: |
          bash scripts/verify-web-staging-config.sh staging
          bash scripts/verify-web-staging-config.sh production

      - name: Build verification — apps/web (OpenNext Cloudflare Worker bundle, staging + production)
        working-directory: apps/web
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec wrangler deploy --dry-run --env staging --outdir=/tmp/wrangler-dryrun/web-staging
          pnpm exec wrangler deploy --dry-run --env production --outdir=/tmp/wrangler-dryrun/web-production

      - name: Build verification — apps/api (Cloudflare Worker bundle, staging + production)
        working-directory: apps/api
        run: |
          npx wrangler deploy --dry-run --env staging --outdir=/tmp/wrangler-dryrun/api-staging
          npx wrangler deploy --dry-run --env production --outdir=/tmp/wrangler-dryrun/api-production

      - name: Build verification — message-consumer (Cloudflare Worker bundle, staging + production)
        working-directory: apps/workers/message-consumer
        run: |
          npx wrangler deploy --dry-run --env staging --outdir=/tmp/wrangler-dryrun/message-consumer-staging
          npx wrangler deploy --dry-run --env production --outdir=/tmp/wrangler-dryrun/message-consumer-production

      - name: Build verification — voice-consumer (Cloudflare Worker bundle, staging + production)
        working-directory: apps/workers/voice-consumer
        run: |
          npx wrangler deploy --dry-run --env staging --outdir=/tmp/wrangler-dryrun/voice-consumer-staging
          npx wrangler deploy --dry-run --env production --outdir=/tmp/wrangler-dryrun/voice-consumer-production

      - name: Build verification — outbound-reconciler (Cloudflare Worker bundle, staging + production)
        working-directory: apps/workers/outbound-reconciler
        run: |
          npx wrangler deploy --dry-run --env staging --outdir=/tmp/wrangler-dryrun/outbound-reconciler-staging
          npx wrangler deploy --dry-run --env production --outdir=/tmp/wrangler-dryrun/outbound-reconciler-production

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-${{ github.run_id }}
          path: |
            /tmp/dravonix_rls_test_output.log
            /tmp/wrangler-dryrun/**
          if-no-files-found: ignore
          retention-days: 7
